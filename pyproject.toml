[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-q-rl"
version = "0.1.0"
description = "DQN from scratch: a hand-rolled numpy MLP (manual backprop, no autograd), experience replay, and a target network, trained on a self-implemented CartPole."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
